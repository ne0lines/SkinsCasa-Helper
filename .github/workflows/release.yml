name: Release SkinsCasa

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v0.1.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm exec electron-builder -- --mac dmg --arm64 --publish never --config.mac.artifactName=SkinsCasa-macOS-Apple-Silicon.dmg
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - run: npm exec electron-builder -- --mac dmg --x64 --publish never --config.mac.artifactName=SkinsCasa-macOS-Intel.dmg
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: SkinsCasa-macOS
          path: |
            dist/SkinsCasa-macOS-Apple-Silicon.dmg
            dist/SkinsCasa-macOS-Intel.dmg

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm exec electron-builder -- --win nsis --x64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: SkinsCasa-Windows
          path: dist/SkinsCasa-Windows.exe

  publish:
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
      - run: gh release create "$RELEASE_TAG" --title "SkinsCasa $RELEASE_TAG" --generate-notes --latest release-assets/*/*
